name: Atualizar playlist do YouTube

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-playlist-youtube
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Instalar leitor da playlist
        run: python -m pip install --upgrade yt-dlp
      - name: Atualizar catálogo completo
        run: python scripts/update_youtube_playlist.py
      - name: Salvar catálogo quando houver mudanças
        run: |
          if git diff --quiet -- data/youtube-playlist.json; then
            echo "A playlist não mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-playlist.json
          git commit -m "Atualiza episódios da playlist do YouTube"
          git push
